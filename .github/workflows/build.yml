# Builds WorkHub-web.exe and WorkHub-Desktop.exe on every push. Pushing a tag like v1.0 also publishes a
# GitHub Release with both executables and a zip attached, so the work laptop only
# needs a browser to download it (no Git, Go or admin rights).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows: the Go tests, then WorkHub-web.exe started and checked in a browser (every page, Windows-only parts).
  # Separate from the release build: a failure here is reported, it doesn't stop a release.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests (Windows)
        shell: bash
        run: |
          go vet ./... 2>&1 | grep -v "possible misuse of unsafe.Pointer" || true
          go test -short -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser check (Windows)
        shell: pwsh
        run: |
          go build -o workhub.exe .
          pip install -q playwright
          python -m playwright install chromium
          $data = Join-Path $env:RUNNER_TEMP "whdata"
          Start-Process -FilePath .\workhub.exe -ArgumentList @("-data", $data, "-port", "47960", "-no-browser")
          for ($i = 0; $i -lt 60 -and -not (Test-Path (Join-Path $data "session.token")); $i++) { Start-Sleep -Milliseconds 500 }
          $tok = (Get-Content (Join-Path $data "session.token")).Trim()
          python tools/uitest/win_smoke.py "http://127.0.0.1:47960/?t=$tok"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          GOOS=windows go vet ./... 2>&1 | grep -v "possible misuse of unsafe.Pointer" || true
          GOOS=windows go vet -tags desktop ./... 2>&1 | grep -v "possible misuse of unsafe.Pointer" || true
          go test -short ./...

      - name: Build WorkHub-web.exe and WorkHub-Desktop.exe
        run: |
          stamp=$(date -u +%Y-%m-%d-%H%M)
          version="${GITHUB_REF_NAME}-${stamp}"
          mkdir -p dist
          # Two versions, always built together: web (browser) and desktop (own window).
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/WorkHub-web.exe .
          GOOS=windows GOARCH=amd64 go build -trimpath -tags desktop -ldflags "-s -w -H windowsgui -X main.version=${version}" -o dist/WorkHub-Desktop.exe .
          cp README.md TESTING.txt dist/
          (cd dist && zip -q "WorkHub-${stamp}.zip" WorkHub-web.exe WorkHub-Desktop.exe README.md TESTING.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: WorkHub
          path: |
            dist/WorkHub-web.exe
            dist/WorkHub-Desktop.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') }} # v1.18.0-beta.1: only for the Beta channel
          files: |
            dist/WorkHub-web.exe
            dist/WorkHub-Desktop.exe
            dist/WorkHub-*.zip
